<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>벽돌깨기 대작전</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1022;color:white;font-family:system-ui,'Malgun Gothic',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}.wrap{width:min(96vw,850px)}h1{text-align:center;margin:12px;color:#f7d36b}.hud{display:flex;justify-content:space-around;background:#202b4a;padding:12px;border-radius:12px;margin-bottom:10px;font-weight:bold}canvas{display:block;width:100%;background:linear-gradient(#111c39,#091022);border:2px solid #536a9c;border-radius:12px;touch-action:none}.controls{text-align:center;margin:12px}.controls button{background:#f5c957;border:0;padding:12px 20px;border-radius:9px;font-weight:bold;cursor:pointer;margin:4px}p{text-align:center;color:#b8c8ed;font-size:14px}</style></head><body><div class="wrap"><h1>🧱 벽돌깨기 대작전</h1><div class="hud"><span id="level">단계 1</span><span id="score">점수 0</span><span id="lives">생명 3 / 최대 5</span><span id="count">남은 벽돌 0</span></div><canvas id="game" width="800" height="540"></canvas><div class="controls"><button onclick="start(1)">1단계 시작</button><button onclick="start(2)">2단계 시작</button><button onclick="start(3)">3단계 시작</button><button onclick="spaceAction()">시작 / 일시정지 / 계속 (스페이스)</button><button onclick="nextStage()">다음 단계</button><button onclick="retry()">다시 하기</button></div><p>마우스·방향키로 이동하고 스페이스바로 시작·일시정지·재개하세요. 벽돌 10개마다 공이 추가되고, 20개마다 생명이 1개 회복됩니다(최대 5개). 모든 벽돌을 깨면 다음 단계로!</p></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const W=800,H=540;let stage=1,score=0,lives=3,bricks=[],balls=[],paddle={x:340,y:505,w:120,h:15},running=false,paused=false,broken=0,last=0,message='단계를 선택해 시작하세요';const colors=['#ff6680','#ffab5e','#ffe070','#63dcb3','#72b8ff','#b08bff'];
function init(n,reset=true){stage=n;if(reset){score=0;lives=3;broken=0}paddle.w=Math.max(75,135-stage*15);paddle.x=(W-paddle.w)/2;bricks=[];let rows=3+stage,cols=10,gap=7,bw=67,bh=22,startX=(W-(cols*bw+(cols-1)*gap))/2;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:startX+c*(bw+gap),y:65+r*31,w:bw,h:bh,alive:true,color:colors[r%colors.length]});balls=[{x:W/2,y:430,vx:3.2+stage*.65,vy:-4-stage*.4,r:8}];running=true;paused=false;message='';updateHud()}
function start(n){init(n,true)}function retry(){init(stage,true)}function nextStage(){if(stage<3)init(stage+1,false);else{running=false;paused=false;message='마지막 단계입니다. 다시 하기를 눌러주세요'}}function spaceAction(){if(!running){init(stage,true)}else togglePause()}function togglePause(){if(running)paused=!paused}function updateHud(){document.getElementById('level').textContent='단계 '+stage;document.getElementById('score').textContent='점수 '+score;document.getElementById('lives').textContent='생명 '+lives+' / 최대 5';document.getElementById('count').textContent='남은 벽돌 '+bricks.filter(b=>b.alive).length}
function move(clientX){let rect=canvas.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(clientX-rect.left)*W/rect.width-paddle.w/2))}canvas.addEventListener('mousemove',e=>move(e.clientX));canvas.addEventListener('pointerdown',e=>move(e.clientX));canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')move(e.clientX)});window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();spaceAction()}if(e.key==='ArrowLeft')paddle.x=Math.max(0,paddle.x-35);if(e.key==='ArrowRight')paddle.x=Math.min(W-paddle.w,paddle.x+35)});
function step(dt){if(!running||paused)return;let factor=Math.min(dt/16.67,1.7);for(let ball of balls){let oldX=ball.x,oldY=ball.y;ball.x+=ball.vx*factor;ball.y+=ball.vy*factor;if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}if(ball.vy>0&&oldY+ball.r<=paddle.y&&ball.y+ball.r>=paddle.y&&ball.x>=paddle.x-ball.r&&ball.x<=paddle.x+paddle.w+ball.r){ball.y=paddle.y-ball.r;let hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);let speed=Math.hypot(ball.vx,ball.vy);ball.vx=hit*speed*.82;ball.vy=-Math.sqrt(Math.max(speed*speed-ball.vx*ball.vx,8))}for(let b of bricks){if(!b.alive)continue;let nearX=Math.max(b.x,Math.min(ball.x,b.x+b.w)),nearY=Math.max(b.y,Math.min(ball.y,b.y+b.h));if((ball.x-nearX)**2+(ball.y-nearY)**2<=ball.r**2){b.alive=false;score+=stage*10;broken++;if(broken%20===0)lives=Math.min(5,lives+1);let wasSide=oldX+ball.r<=b.x||oldX-ball.r>=b.x+b.w;if(wasSide)ball.vx*=-1;else ball.vy*=-1;if(broken%10===0&&balls.length<6){balls.push({x:ball.x,y:ball.y,vx:-ball.vx+(Math.random()-.5),vy:-Math.abs(ball.vy),r:8})}updateHud();break}}}balls=balls.filter(b=>b.y-b.r<H);if(bricks.every(b=>!b.alive)){if(stage<3){init(stage+1,false);message='다음 단계!';setTimeout(()=>{if(running)message=''},1100)}else{running=false;message='🎉 3단계까지 모두 성공! 최종 점수 '+score}}else if(!balls.length){lives--;if(lives<=0){running=false;message='게임 종료! 최종 점수 '+score}else{balls=[{x:W/2,y:430,vx:3.2+stage*.65,vy:-4-stage*.4,r:8}];message='목숨이 하나 줄었습니다';setTimeout(()=>{if(running)message=''},1100)}updateHud()}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#142241';ctx.fillRect(0,0,W,H);for(let i=0;i<40;i++){ctx.fillStyle='#ffffff18';ctx.fillRect((i*173+31)%W,(i*97+47)%H,2,2)}for(let b of bricks)if(b.alive){ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,5);ctx.fill();ctx.fillStyle='#ffffff45';ctx.fillRect(b.x+5,b.y+4,b.w-10,3)}ctx.fillStyle='#f6d36d';ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,8);ctx.fill();for(let b of balls){ctx.shadowColor='#8feaff';ctx.shadowBlur=15;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}if(!running||paused||message){ctx.fillStyle='#081020bb';ctx.fillRect(0,220,W,110);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 28px system-ui';ctx.fillText(paused?'일시정지':message||'단계를 선택하세요',W/2,282)}}function loop(t){let dt=last?t-last:16.67;last=t;step(dt);draw();requestAnimationFrame(loop)}updateHud();requestAnimationFrame(loop);
</script></body></html>
